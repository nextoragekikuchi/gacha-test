<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nextorageガチャ</title>
<style>
:root{
  --navy:#061630; --deep:#0b2f5c; --blue:#0077c8; --cyan:#3ec6ff; --gold:#ffc83d; --ink:#12263a; --mute:#5b7086; --ok:#1f9d68;
  --rc:var(--cyan);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--navy) radial-gradient(circle at 50% 30%,#0f3e75 0,var(--navy) 62%) no-repeat;
  color:#fff; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  padding:env(safe-area-inset-top,0) 18px env(safe-area-inset-bottom,0); display:flex; justify-content:center; overflow-x:hidden;
}
main{width:100%; max-width:420px; padding:22px 0 36px; text-align:center}
button{font:inherit; cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--gold); outline-offset:3px}

h1{margin:0; font-size:34px; line-height:1.15; font-style:italic; font-weight:900; letter-spacing:.01em;
  -webkit-text-stroke:5px var(--blue); paint-order:stroke fill; text-shadow:0 4px 0 #0a4f8f}
.ribbon{display:inline-block; margin:10px 0 2px; padding:4px 18px; background:var(--gold); color:var(--ink); font-weight:900; font-size:14px; transform:skewX(-10deg); border-radius:3px}
.who{min-height:20px; margin:8px 0 0; color:#9cc4e6; font-size:13px}

/* lens + shutter */
.lens{position:relative; width:min(78vw,300px); aspect-ratio:1; margin:8px auto 18px}
.lens[data-r=SSR]{--rc:#ffc83d} .lens[data-r=SR]{--rc:#b57bff} .lens[data-r=R]{--rc:#3ec6ff} .lens[data-r=N]{--rc:#c9d6e3}
.rays{position:absolute; inset:-34%; opacity:0; border-radius:50%; pointer-events:none;
  background:repeating-conic-gradient(var(--rc) 0 5deg,transparent 5deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 18%,transparent 62%); mask-image:radial-gradient(circle,#000 18%,transparent 62%)}
.lens.charge .rays{opacity:.5; animation:turn 6s linear infinite; transition:opacity .6s}
.lens.open .rays{opacity:.9}
.lens svg{position:relative; width:100%; height:100%; overflow:visible}
.rot{transform-origin:150px 150px}
.lens.charge .rot{animation:charge 1.7s cubic-bezier(.5,0,.9,.6) forwards}
.blade{transform:translate(150px,150px) rotate(var(--a)) translateY(0); transition:transform .55s ease-in, opacity .55s ease-in}
.lens.open .blade{transform:translate(150px,150px) rotate(var(--a)) translateY(-130px); opacity:0}
.core{opacity:0; transition:opacity .4s}
.lens.open .core{opacity:1}
.lens.charge .halo{animation:pulse .5s ease-in-out infinite alternate}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes charge{0%{transform:rotate(0)} 100%{transform:rotate(300deg)}}
@keyframes pulse{from{opacity:.4} to{opacity:1}}

.spin{position:relative; z-index:2; width:100%; padding:17px; border:0; border-radius:16px; background:linear-gradient(#ffe27a,var(--gold)); color:var(--ink);
  font-size:22px; font-weight:900; letter-spacing:.06em; box-shadow:0 6px 0 #c98f00,0 10px 18px rgba(0,0,0,.35)}
.spin:active:not(:disabled){transform:translateY(4px); box-shadow:0 2px 0 #c98f00}
.spin:disabled{opacity:.65; cursor:default}
details{margin-top:18px; font-size:12px; color:#9cc4e6; text-align:left}
summary{cursor:pointer; text-align:center}
.rates{margin:8px auto 0; max-width:240px; display:grid; grid-template-columns:1fr auto; gap:3px 12px}
.rates b{color:#fff}

/* result card */
.result{display:none}
.result.show{display:block}
.card-wrap{perspective:900px; width:260px; height:352px; margin:0 auto 18px}
.card{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden}
.back{background:linear-gradient(135deg,var(--deep),#0a4f8f); border:3px solid #7fc4ee; display:flex; align-items:center; justify-content:center; font-weight:900; font-style:italic; font-size:22px}
.front{transform:rotateY(180deg); background:#f4f9fe; color:var(--ink); border:5px solid var(--rc); box-shadow:0 0 28px var(--rc); display:flex; flex-direction:column}
.card[data-r=SSR]{--rc:#ffc83d} .card[data-r=SR]{--rc:#b57bff} .card[data-r=R]{--rc:#3ec6ff} .card[data-r=N]{--rc:#c9d6e3}
.band{display:flex; justify-content:space-between; align-items:center; padding:8px 14px; background:var(--rc); color:#12263a; font-weight:900}
.band .rk{font-size:26px; font-style:italic; letter-spacing:.03em}
.stars{font-size:15px; letter-spacing:1px}
.art{flex:1; display:flex; align-items:center; justify-content:center; padding:14px;
  background:radial-gradient(circle,#fff 0,#dcecf9 70%)}
.art svg,.art img{max-width:86%; max-height:100%; filter:drop-shadow(0 6px 6px rgba(11,47,92,.3))}
.pname{padding:12px 10px 16px; font-size:20px; font-weight:900; line-height:1.3}
.card[data-r=SSR] .front::after,.card[data-r=SR] .front::after{content:""; position:absolute; inset:0;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%); transform:translateX(-120%); animation:shine 1.4s .9s ease-out forwards}
@keyframes shine{to{transform:translateX(120%)}}

.msg{margin:0 0 14px; color:#cfe4f6; font-size:14px; line-height:1.6}
.panel{background:#fff; color:var(--ink); border-radius:16px; padding:18px 18px 16px}
.clock{margin:0 0 12px; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.redeem{position:relative; width:100%; padding:16px; border:0; border-radius:12px; overflow:hidden; background:var(--deep); color:#fff; font-size:16px; font-weight:700; user-select:none; -webkit-user-select:none; touch-action:none}
.redeem span{position:relative; z-index:1}
.redeem::before{content:""; position:absolute; inset:0; width:0; background:var(--blue); transition:width .15s linear}
.redeem.holding::before{width:100%; transition:width 1.2s linear}
.redeem-help{margin:10px 0 0; font-size:12px; color:var(--mute)}
.done{display:none; margin:0; padding:14px; border-radius:12px; background:#e3f6ee; color:var(--ok); font-weight:800; font-size:18px}
.result.redeemed .redeem,.result.redeemed .redeem-help{display:none}
.result.redeemed .done{display:block}
.result.miss .panel{display:none}

.flash{position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:0} 25%{opacity:1} 100%{opacity:0}}
.err{display:none; background:#fff; color:var(--ink); border-radius:16px; padding:22px; line-height:1.7; text-align:left}
.debug{margin-top:22px; font-size:12px}
.debug button{background:none; border:0; color:#8fb1cf; text-decoration:underline; padding:6px}
@media (prefers-reduced-motion:reduce){
  .lens.charge .rays,.lens.charge .rot,.lens.charge .halo,.card[data-r] .front::after{animation:none}
  .card,.blade{transition:none}
}
</style>
</head>
<body>
<main>
  <h1>Nextorageガチャ</h1>
  <span class="ribbon">メモリーカード ガチャ</span>
  <p class="who" id="who"></p>

  <section id="stage">
    <div class="lens" id="lens" aria-hidden="true">
      <div class="rays"></div>
      <svg viewBox="0 0 300 300">
        <defs>
          <radialGradient id="cg"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="var(--rc)"/><stop offset="1" stop-color="var(--rc)" stop-opacity="0"/></radialGradient>
          <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd8ff"/><stop offset="1" stop-color="#0077c8"/></linearGradient>
        </defs>
        <circle class="halo" cx="150" cy="150" r="146" fill="none" stroke="var(--rc)" stroke-width="3" opacity=".5"/>
        <circle cx="150" cy="150" r="136" fill="#0b2f5c" stroke="url(#rg)" stroke-width="10"/>
        <circle class="core" cx="150" cy="150" r="104" fill="url(#cg)"/>
        <g class="rot">
          <path class="blade" style="--a:0deg"   d="M0 0 L-56 -108 L56 -108Z" fill="#1b6fbd" stroke="#0b2f5c" stroke-width="3"/>
          <path class="blade" style="--a:60deg"  d="M0 0 L-56 -108 L56 -108Z" fill="#2a86d8" stroke="#0b2f5c" stroke-width="3"/>
          <path class="blade" style="--a:120deg" d="M0 0 L-56 -108 L56 -108Z" fill="#1b6fbd" stroke="#0b2f5c" stroke-width="3"/>
          <path class="blade" style="--a:180deg" d="M0 0 L-56 -108 L56 -108Z" fill="#2a86d8" stroke="#0b2f5c" stroke-width="3"/>
          <path class="blade" style="--a:240deg" d="M0 0 L-56 -108 L56 -108Z" fill="#1b6fbd" stroke="#0b2f5c" stroke-width="3"/>
          <path class="blade" style="--a:300deg" d="M0 0 L-56 -108 L56 -108Z" fill="#2a86d8" stroke="#0b2f5c" stroke-width="3"/>
        </g>
        <circle cx="150" cy="150" r="14" fill="#0b2f5c" stroke="#9fd8ff" stroke-width="3"/>
      </svg>
    </div>
    <button class="spin" id="spin" disabled>準備中...</button>
    <details id="ratesBox" hidden><summary>提供割合</summary><div class="rates" id="rates"></div></details>
  </section>

  <section class="result" id="result" aria-live="polite">
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="face back">Nextorage</div>
        <div class="face front">
          <div class="band"><span class="rk" id="rk"></span><span class="stars" id="stars"></span></div>
          <div class="art" id="art"></div>
          <div class="pname" id="pname"></div>
        </div>
      </div>
    </div>
    <p class="msg" id="msg"></p>
    <div class="panel">
      <p class="clock" id="clock"></p>
      <button class="redeem" id="redeem"><span>スタッフが長押しして引き換え</span></button>
      <p class="redeem-help">景品をお渡しするとき、スタッフがこのボタンを長押しします。</p>
      <p class="done">引き換え済み</p>
    </div>
  </section>

  <section class="err" id="err"></section>
  <p class="debug" id="debug" hidden><button id="reset">テスト用: 最初からやり直す</button></p>
</main>
<div class="flash" id="flash"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ===== 設定(ここだけ編集すれば景品を変えられます) ===== */
const LIFF_ID    = "2012132198-SbUNYmJT";
const DEBUG      = true;    // 本番公開前に false にする
const SHOW_RATES = true;    // 提供割合を画面に表示する
/* rarity: SSR / SR / R / N     art: camera / sd / cf   img: 自社の画像URL(指定すると art より優先) */
const PRIZES = [
  { rarity:"SSR", name:"景品A(仮)", weight:1,  win:true, art:"camera", img:"" },
  { rarity:"SR",  name:"景品B(仮)", weight:4,  win:true, art:"cf",     img:"" },
  { rarity:"R",   name:"景品C(仮)", weight:15, win:true, art:"sd",     img:"" },
  { rarity:"N",   name:"参加賞(仮)", weight:30, win:true, art:"sd",     img:"" }
];
/* ======================================================== */

const STARS = { SSR:5, SR:4, R:3, N:2 };
const ART = {
  camera:'<svg viewBox="0 0 120 90"><rect x="8" y="24" width="104" height="58" rx="9" fill="#2b3f55"/><path d="M38 24l6-12h32l6 12z" fill="#34506b"/><circle cx="60" cy="53" r="24" fill="#10202f"/><circle cx="60" cy="53" r="17" fill="#1c6fb8"/><circle cx="60" cy="53" r="9" fill="#0b1f33"/><circle cx="53" cy="46" r="4" fill="#fff" opacity=".7"/><rect x="16" y="31" width="14" height="8" rx="3" fill="#ffc83d"/><circle cx="98" cy="35" r="5" fill="#c9d6e3"/></svg>',
  sd:'<svg viewBox="0 0 90 120"><path d="M8 8h50l24 24v80H8z" fill="#0077c8"/><path d="M8 8h50l24 24H8z" fill="#0b2f5c" opacity=".25"/><rect x="18" y="40" width="54" height="36" rx="4" fill="#fff"/><text x="45" y="66" text-anchor="middle" font-size="22" font-weight="900" fill="#0b2f5c" font-family="sans-serif">SD</text><g fill="#ffc83d"><rect x="16" y="92" width="7" height="16"/><rect x="26" y="92" width="7" height="16"/><rect x="36" y="92" width="7" height="16"/><rect x="46" y="92" width="7" height="16"/><rect x="56" y="92" width="7" height="16"/></g></svg>',
  cf:'<svg viewBox="0 0 100 120"><rect x="8" y="6" width="84" height="108" rx="8" fill="#1a2b3d"/><rect x="8" y="30" width="84" height="26" fill="#0077c8"/><text x="50" y="49" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" font-family="sans-serif">CFexpress</text><rect x="22" y="70" width="56" height="14" rx="3" fill="#2f4660"/><g fill="#ffc83d"><rect x="18" y="96" width="9" height="14"/><rect x="31" y="96" width="9" height="14"/><rect x="44" y="96" width="9" height="14"/><rect x="57" y="96" width="9" height="14"/><rect x="70" y="96" width="9" height="14"/></g></svg>'
};

const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const PREVIEW = location.hash === "#preview";   // LINE外でデザイン確認するとき用
let userId = "guest";

function store(key, val){
  try{
    if(val === undefined){ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    if(val === null){ localStorage.removeItem(key); return; }
    localStorage.setItem(key, JSON.stringify(val));
  }catch(e){ return null; }
}
const KEY = () => "gacha:" + userId;

/* --- 抽選: 今は端末内の仮処理。次の段階でサーバーのAPIに置き換えます --- */
async function getResult(){
  const saved = store(KEY());
  if(saved) return saved;                          // 1人1回(仮)
  const total = PRIZES.reduce((s,p) => s + p.weight, 0);
  let r = Math.random() * total, picked = PRIZES[PRIZES.length - 1];
  for(const p of PRIZES){ if((r -= p.weight) < 0){ picked = p; break; } }
  const result = { rarity:picked.rarity, name:picked.name, win:picked.win, art:picked.art, img:picked.img, redeemed:false };
  store(KEY(), result);
  return result;
}

function showRates(){
  if(!SHOW_RATES) return;
  const total = PRIZES.reduce((s,p) => s + p.weight, 0);
  $("rates").innerHTML = PRIZES.map((p) =>
    "<span><b>" + p.rarity + "</b> " + p.name + "</span><span>" + (p.weight / total * 100).toFixed(1) + "%</span>").join("");
  $("ratesBox").hidden = false;
}

function showResult(res, animate){
  $("stage").style.display = "none";
  const card = $("card");
  card.dataset.r = res.rarity;
  $("rk").textContent = res.rarity;
  $("stars").textContent = "★".repeat(STARS[res.rarity] || 1);
  $("pname").textContent = res.name;
  if(res.img){ const im = new Image(); im.alt = ""; im.src = res.img; $("art").replaceChildren(im); }
  else { $("art").innerHTML = ART[res.art] || ART.sd; }
  $("msg").textContent = res.win ? "おめでとうございます!スタッフにこの画面をお見せください。" : "ご参加ありがとうございました。";
  const box = $("result");
  box.classList.toggle("miss", !res.win);
  box.classList.toggle("redeemed", !!res.redeemed);
  box.classList.add("show");
  if(animate){ setTimeout(() => card.classList.add("flipped"), 350); } else { card.classList.add("flipped"); }
}

/* 画面に現在時刻を出し続ける(スクリーンショットの使い回し防止) */
const tick = () => { $("clock").textContent = new Date().toLocaleTimeString("ja-JP"); };
tick(); setInterval(tick, 1000);

async function spin(){
  $("spin").disabled = true;
  const lens = $("lens");
  lens.classList.add("charge");
  const [res] = await Promise.all([getResult(), wait(1800)]);
  lens.dataset.r = res.rarity;          // ここで光の色がレア度の色に変わる
  lens.classList.add("open");
  await wait(650);
  $("flash").classList.add("go");
  await wait(250);
  showResult(res, true);
}

/* スタッフ用: 1.2秒の長押しで「引き換え済み」にする */
function setupRedeem(){
  const b = $("redeem"); let timer = null;
  const start = (e) => {
    e.preventDefault(); b.classList.add("holding");
    timer = setTimeout(() => {
      const res = store(KEY()) || {};
      res.redeemed = true; store(KEY(), res);
      $("result").classList.add("redeemed");
    }, 1200);
  };
  const stop = () => { clearTimeout(timer); b.classList.remove("holding"); };
  b.addEventListener("pointerdown", start);
  ["pointerup","pointerleave","pointercancel"].forEach((ev) => b.addEventListener(ev, stop));
  b.addEventListener("contextmenu", (e) => e.preventDefault());
}

function fail(html){
  $("stage").style.display = "none";
  $("err").innerHTML = html; $("err").style.display = "block";
}

async function main(){
  setupRedeem(); showRates();
  if(DEBUG){
    $("debug").hidden = false;
    $("reset").onclick = () => { store(KEY(), null); location.reload(); };
  }
  if(!PREVIEW){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }
      const p = await liff.getProfile();
      userId = p.userId; $("who").textContent = p.displayName + " さん";
    }catch(e){
      fail("LINEから開いてください。<br>うまく開けない場合は、LINEアプリを最新版に更新してから、もう一度QRコードを読み取ってください。");
      return;
    }
  }
  const saved = store(KEY());
  if(saved){ showResult(saved, false); return; }   // 2回目以降は同じ結果を表示
  $("spin").textContent = "ガチャを回す"; $("spin").disabled = false;
  $("spin").onclick = spin;
}
main();
</script>
</body>
</html>
