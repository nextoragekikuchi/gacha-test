<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nextorageガチャ</title>
<style>
:root{
  --navy:#0b2a4a; --blue:#0077c8; --ice:#eaf3fb; --sun:#ffc93c; --ink:#12263a; --mute:#5b7086; --ok:#1f9d68;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--navy); color:#fff;
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  padding:env(safe-area-inset-top,0) 20px env(safe-area-inset-bottom,0);
  display:flex; justify-content:center;
}
main{width:100%; max-width:420px; padding:28px 0 36px; text-align:center}
h1{font-size:26px; line-height:1.3; margin:0 0 8px; letter-spacing:.02em}
.sub{margin:0 0 4px; color:#b8d3ea; font-size:15px; line-height:1.6}
.who{min-height:22px; margin:0 0 20px; color:#b8d3ea; font-size:14px}
button{font:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--sun); outline-offset:3px}

/* capsule */
.stage{padding:18px 0 8px}
.capsule{position:relative; width:180px; height:220px; margin:0 auto 28px}
.half{position:absolute; left:0; width:180px; height:110px; transition:transform .5s ease-in, opacity .5s ease-in}
.top{top:0; background:var(--blue); border-radius:90px 90px 0 0}
.top::after{content:""; position:absolute; left:34px; top:26px; width:30px; height:56px; border-radius:20px; background:rgba(255,255,255,.35); transform:rotate(18deg)}
.bot{bottom:0; background:var(--ice); border-radius:0 0 90px 90px; border-top:6px solid #fff}
.capsule.shake{animation:shake .45s linear infinite}
.capsule.open .top{transform:translateY(-80px) rotate(-18deg); opacity:0}
.capsule.open .bot{transform:translateY(80px) rotate(14deg); opacity:0}
@keyframes shake{
  0%{transform:translateX(0) rotate(0)} 20%{transform:translateX(-10px) rotate(-9deg)}
  50%{transform:translateX(10px) rotate(9deg)} 80%{transform:translateX(-6px) rotate(-5deg)} 100%{transform:translateX(0) rotate(0)}
}
.spin{
  width:100%; padding:18px; border:0; border-radius:14px;
  background:var(--sun); color:var(--ink); font-size:20px; font-weight:800;
}
.spin:disabled{opacity:.6; cursor:default}
.note{margin:14px 0 0; font-size:13px; color:#8fb1cf; line-height:1.6}

/* result */
.result{display:none; background:#fff; color:var(--ink); border-radius:20px; padding:28px 22px 24px; text-align:center; animation:pop .45s ease-out}
.result.show{display:block}
@keyframes pop{from{opacity:0; transform:scale(.92)} to{opacity:1; transform:scale(1)}}
.rank{margin:0; font-size:15px; font-weight:700; color:var(--blue)}
.prize{margin:6px 0 4px; font-size:28px; line-height:1.3; font-weight:800}
.msg{margin:0 0 18px; color:var(--mute); font-size:14px; line-height:1.6}
.clock{margin:0 0 18px; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.redeem{position:relative; width:100%; padding:16px; border:0; border-radius:12px; overflow:hidden; background:var(--navy); color:#fff; font-size:16px; font-weight:700; user-select:none; -webkit-user-select:none; touch-action:none}
.redeem span{position:relative; z-index:1}
.redeem::before{content:""; position:absolute; inset:0; width:0; background:var(--blue); transition:width .15s linear}
.redeem.holding::before{width:100%; transition:width 1.2s linear}
.redeem-help{margin:10px 0 0; font-size:12px; color:var(--mute)}
.done{display:none; margin:0; padding:14px; border-radius:12px; background:#e3f6ee; color:var(--ok); font-weight:800; font-size:18px}
.result.redeemed .redeem,.result.redeemed .redeem-help{display:none}
.result.redeemed .done{display:block}
.result.miss .redeem,.result.miss .redeem-help,.result.miss .clock{display:none}
.debug{margin-top:22px; font-size:12px}
.debug button{background:none; border:0; color:#8fb1cf; text-decoration:underline; padding:6px}
.err{display:none; background:#fff; color:var(--ink); border-radius:16px; padding:22px; line-height:1.7; text-align:left}
@media (prefers-reduced-motion:reduce){
  .capsule.shake{animation:none} .result{animation:none} .half{transition:none}
}
</style>
</head>
<body>
<main>
  <h1>Nextorageガチャ</h1>
  <p class="sub">1人1回、その場で結果がわかります。</p>
  <p class="who" id="who"></p>

  <section class="stage" id="stage">
    <div class="capsule" id="capsule" aria-hidden="true"><div class="half top"></div><div class="half bot"></div></div>
    <button class="spin" id="spin" disabled>準備中...</button>
    <p class="note">ボタンを押すと抽選が始まります。</p>
  </section>

  <section class="result" id="result" aria-live="polite">
    <p class="rank" id="rank"></p>
    <p class="prize" id="prize"></p>
    <p class="msg" id="msg"></p>
    <p class="clock" id="clock"></p>
    <button class="redeem" id="redeem"><span>スタッフが長押しして引き換え</span></button>
    <p class="redeem-help">景品をお渡しするとき、スタッフがこのボタンを長押しします。</p>
    <p class="done">引き換え済み</p>
  </section>

  <section class="err" id="err"></section>

  <p class="debug" id="debug" hidden><button id="reset">テスト用: 最初からやり直す</button></p>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ===== 設定(ここだけ編集すれば景品を変えられます) ===== */
const LIFF_ID = "2012132198-SbUNYmJT";
const DEBUG   = true;   // 本番公開前に false にする(やり直しリンクが消えます)
const PRIZES = [        // weight が大きいほど当たりやすい(仮の値)
  { rank:"A賞", name:"景品A(仮)", weight:1,  win:true },
  { rank:"B賞", name:"景品B(仮)", weight:4,  win:true },
  { rank:"C賞", name:"景品C(仮)", weight:15, win:true },
  { rank:"ハズレ", name:"また挑戦してね", weight:30, win:false }
];
/* ======================================================== */

const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const PREVIEW = location.hash === "#preview";   // LINE外でデザイン確認するとき用
let userId = "guest";

function store(key, val){
  try{
    if(val === undefined){ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    if(val === null){ localStorage.removeItem(key); return; }
    localStorage.setItem(key, JSON.stringify(val));
  }catch(e){ return null; }
}
const KEY = () => "gacha:" + userId;

/* --- 抽選: 今は端末内の仮処理。次の段階でサーバーのAPIに置き換えます --- */
async function getResult(){
  const saved = store(KEY());
  if(saved) return saved;                          // 1人1回(仮)
  const total = PRIZES.reduce((s,p) => s + p.weight, 0);
  let r = Math.random() * total, picked = PRIZES[PRIZES.length - 1];
  for(const p of PRIZES){ if((r -= p.weight) < 0){ picked = p; break; } }
  const result = { rank:picked.rank, name:picked.name, win:picked.win, redeemed:false };
  store(KEY(), result);
  return result;
}

function showResult(res){
  $("stage").style.display = "none";
  $("rank").textContent  = res.rank;
  $("prize").textContent = res.name;
  $("msg").textContent   = res.win ? "おめでとうございます!スタッフにこの画面をお見せください。"
                                   : "ご参加ありがとうございました。";
  const box = $("result");
  box.classList.toggle("miss", !res.win);
  box.classList.toggle("redeemed", !!res.redeemed);
  box.classList.add("show");
}

/* 画面に現在時刻を出し続ける(スクリーンショットの使い回し防止) */
setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString("ja-JP"); }, 1000);
$("clock").textContent = new Date().toLocaleTimeString("ja-JP");

async function spin(){
  $("spin").disabled = true;
  const cap = $("capsule");
  cap.classList.add("shake");
  const [res] = await Promise.all([getResult(), wait(1800)]);
  cap.classList.remove("shake");
  cap.classList.add("open");
  await wait(500);
  showResult(res);
}

/* スタッフ用: 1.2秒の長押しで「引き換え済み」にする */
function setupRedeem(){
  const b = $("redeem"); let timer = null;
  const start = (e) => {
    e.preventDefault(); b.classList.add("holding");
    timer = setTimeout(() => {
      const res = store(KEY()) || {};
      res.redeemed = true; store(KEY(), res);
      $("result").classList.add("redeemed");
    }, 1200);
  };
  const stop = () => { clearTimeout(timer); b.classList.remove("holding"); };
  b.addEventListener("pointerdown", start);
  ["pointerup","pointerleave","pointercancel"].forEach((ev) => b.addEventListener(ev, stop));
  b.addEventListener("contextmenu", (e) => e.preventDefault());
}

function fail(html){
  $("stage").style.display = "none";
  $("err").innerHTML = html; $("err").style.display = "block";
}

async function main(){
  setupRedeem();
  if(DEBUG){
    $("debug").hidden = false;
    $("reset").onclick = () => { store(KEY(), null); location.reload(); };
  }
  if(!PREVIEW){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }
      const p = await liff.getProfile();
      userId = p.userId; $("who").textContent = p.displayName + " さん";
    }catch(e){
      fail("LINEから開いてください。<br>うまく開けない場合は、LINEアプリを最新版に更新してから、もう一度QRコードを読み取ってください。");
      return;
    }
  }
  const saved = store(KEY());
  if(saved){ $("capsule").classList.add("open"); showResult(saved); return; }   // 2回目以降は同じ結果を表示
  $("spin").textContent = "ガチャを回す"; $("spin").disabled = false;
  $("spin").onclick = spin;
}
main();
</script>
</body>
</html>
